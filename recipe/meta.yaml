{% set name = "kelp-o-matic" %}
{% set version = "0.14.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 796a2c2ce542312cdcd533cb41ff7270d53358a8a73db922e6da6ac1f48b20e1

build:
  entry_points:
    - kom = kelp_o_matic.main:app
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >={{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - cyclopts >=3.22.2
    - deprecation >=2.1.0
    - humanize >=4.12.3
    - loguru >=0.7.3
    - numpy >=2.2.6
    - onnxruntime >=1.22.0
    - opencv >=4.11.0
    - platformdirs >=4.3.8
    - pydantic >=2.11.7
    - rasterio >=1.4.3
    - requests >=2.32.4
    - rich >=13.0.0

test:
  imports:
    - kelp_o_matic
  commands:
    - pip check
    - kom --help
  requires:
    - pip

about:
  home: https://github.com/HakaiInstitute/kelp-o-matic
  summary: Habitat segmentation with AI
  license: MIT
  license_file: LICENSE.txt
  doc_url: https://kelp-o-matic.readthedocs.io
  dev_url: https://github.com/HakaiInstitute/kelp-o-matic

extra:
  recipe-maintainers:
    - tayden